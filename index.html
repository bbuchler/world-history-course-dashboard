<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World History Course Build</title>
<style>
:root{--yellow:#F3CF45;--blue:#0071ce;--ink:#273540;--muted:#5b6474;--line:#d9dde7;--soft:#f2f2f7;--green:#2e9e5b;--orange:#b86514;--purple:#7356a6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f8f9fc;font-size:16px;line-height:1.45}
header{border-top:8px solid var(--yellow);background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;position:sticky;top:0;z-index:2}
.hwrap{max-width:1220px;margin:0 auto;display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0;color:var(--blue);margin-right:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;padding:7px 15px;cursor:pointer}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wbbtn{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:700;padding:9px 16px;border-radius:8px;text-decoration:none}
main{max-width:1220px;margin:0 auto;padding:20px 22px 60px}
.panel{background:#fff;border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:8px;padding:16px 20px;margin-bottom:18px}
.panel h2{margin:0 0 8px;font-size:21px;color:var(--blue)}.panel ol{margin:6px 0 0;padding-left:22px}.panel li{margin:5px 0}.panel p{margin:6px 0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}.stat b{display:block;font-size:26px;color:var(--blue)}.stat span{color:var(--muted);font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:10px;flex-wrap:wrap}.toolbar .hint{color:var(--muted);font-size:15px}
.module{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:8px;margin-bottom:12px;overflow:hidden}
.module.project{border-left-color:var(--purple)}.module.exam{border-left-color:#555}
.module-head{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;padding:14px 16px;cursor:pointer}
.module-head:hover{background:#fbfbfe}
.num{background:var(--ink);color:#fff;border-radius:6px;min-height:50px;display:grid;place-items:center;font-size:24px;font-weight:800}
.project .num{background:var(--purple)}.exam .num{background:#555}
.title{font-weight:800;font-size:19px}.topic{color:var(--muted);font-size:15px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:480px}
.chip{border-radius:14px;background:var(--soft);color:var(--ink);font-size:14px;padding:5px 11px;white-space:nowrap}
.chip.ok{background:#e8f5ed;color:var(--green)}.chip.warn{background:#fff1df;color:var(--orange)}.chip.go{background:#e6f0fb;color:var(--blue)}
.arrow{color:var(--blue);font-size:14px;font-weight:700;margin-top:6px}
.details{border-top:1px solid var(--line);background:#fcfcfe;padding:16px 18px 18px;display:none}
.module.open .details{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.block{border:1px solid #e7e9f1;border-radius:8px;padding:12px 14px;background:#fff}
.block.job{border-left:5px solid var(--yellow)}
.block h3{margin:0 0 8px;color:var(--blue);font-size:16px}.block ul{margin:0;padding-left:20px}.block li{margin:3px 0}.block p{margin:4px 0}
.muted{color:var(--muted)}a{color:var(--blue)}
footer{max-width:1220px;margin:0 auto;padding:0 22px 30px;color:var(--muted);font-size:14px}
@media (max-width:760px){.module-head{grid-template-columns:48px 1fr}.chips{grid-column:1/-1;justify-content:flex-start}.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>

let course="World History 1", who="Everyone"; const open=new Set();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first=n=>String(n).split(" ")[0];
const tone=s=>/approved|built|checked/i.test(s)?"ok":/ready|picked|^started/i.test(s)?"go":/progress|revise/i.test(s)?"warn":"";
const job=(d,name)=>d.jobs.find(j=>j.job===name);
const list=a=>a&&a.length?`<ul>${a.join("")}</ul>`:`<p class="muted">Nothing yet.</p>`;
function chips(d){
  const show=who==="Everyone"?["Videos","Stranger Than Fiction","Interactives","Canvas build"]:d.jobs.filter(j=>j.who===who).map(j=>j.job);
  return show.map(n=>{const j=job(d,n);if(!j)return"";const label=n==="Stranger Than Fiction"?"Stories":n==="Canvas build"?"Build":n;
    return `<span class="chip ${tone(j.status)}">${label}: ${esc(first(j.who))} · ${esc(j.status.toLowerCase())}</span>`}).join("");}
function details(d){
  const x=d.detail, v=job(d,"Videos"), s=job(d,"Stranger Than Fiction"), topics=x.textbook.map(esc).join("; ");
  const jobs=v?`<div class="block job"><h3>Videos: ${esc(first(v.who))}</h3><p>Find 2 or 3 YouTube videos, 3 to 10 minutes each, that together cover: <b>${topics}</b>.</p><p>Team sheet, Videos tab: the video title, the link, and the transcript.</p></div>
    <div class="block job"><h3>Stranger Than Fiction: ${esc(first(s.who))}</h3><p>Find 2 or 3 true, surprising stories tied to this module that a student would retell to a friend.</p><p>Team sheet, Stories tab: the story in a sentence or two, a source link, a video if there is one, and how it should be graded.</p></div>`:"";
  return `<div class="grid">${jobs}
  <div class="block"><h3>Textbook (Savvas)</h3>${list(x.textbook.map(t=>`<li>${esc(t)}</li>`))}</div>
  <div class="block"><h3>Interactives (picked by Baptiste)</h3>${list(x.interactives.map(t=>`<li>${esc(t)}</li>`))}</div>
  <div class="block"><h3>Video options so far</h3>${list(x.videos.map(o=>`<li>${o.pick==="Yes"?"<b>Chosen:</b> ":""}<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title||o.url)}</a>${o.runtime?` (${esc(o.runtime)})`:""}${o.covers?`: ${esc(o.covers)}`:""}</li>`))}</div>
  <div class="block"><h3>Story options so far</h3>${list(x.stf.map(o=>`<li>${o.pick==="Yes"?"<b>Chosen:</b> ":""}${esc(o.story)}${o.source?` (<a href="${esc(o.source)}" target="_blank" rel="noopener">source</a>)`:""}${o.grading?`: ${esc(o.grading)}`:""}</li>`))}</div>
  ${x.quiz?`<div class="block"><h3>Module quiz</h3><p>${esc(x.quiz)}</p></div>`:""}
  <div class="block"><h3>Grading</h3><p>${esc(x.grading)}</p></div>
  <div class="block"><h3>Build status</h3><p>${esc(job(d,"Canvas build").status)}${x.canvas?` · <a href="${esc(x.canvas)}" target="_blank" rel="noopener">open in Canvas</a>`:""}</p><p class="muted">After it's built, ${esc(first(job(d,"Team review").who))} clicks through it and notes anything to fix.</p></div>
  </div>`;}
function topPanel(ms){
  if(who==="Everyone"){
    const reg=ms.filter(d=>job(d,"Videos"));const n=f=>reg.filter(f).length;
    return `<div class="panel"><h2>How this works</h2><ol><li><b>Team:</b> for each of your modules, add YouTube videos and Stranger Than Fiction stories in the team sheet.</li><li><b>Baptiste</b> picks the final videos and stories, chooses the interactives, writes the questions, and builds each module in Canvas.</li><li><b>After a module is built</b>, its owner clicks through it and notes anything to fix.</li></ol></div>
    <div class="summary"><div class="stat"><b>${ms.length}</b><span>Modules</span></div><div class="stat"><b>${n(d=>!/not started/i.test(job(d,"Videos").status))} / ${reg.length}</b><span>Have video options</span></div><div class="stat"><b>${n(d=>!/not started/i.test(job(d,"Stranger Than Fiction").status))} / ${reg.length}</b><span>Have story options</span></div><div class="stat"><b>${n(d=>/picked|checked/i.test(job(d,"Interactives").status))} / ${reg.length}</b><span>Interactives picked</span></div><div class="stat"><b>${ms.filter(d=>/built/i.test(job(d,"Canvas build").status)).length} / ${ms.length}</b><span>Built in Canvas</span></div></div>`;}
  const mine=ms.filter(d=>job(d,"Videos")&&job(d,"Videos").who===who).map(d=>d.n);
  if(who==="Baptiste Buchler") return `<div class="panel"><h2>Baptiste</h2><p>Final picks, interactives, questions, and the Canvas build for every module.${mine.length?` Also videos and stories for Module${mine.length>1?"s":""} ${mine.join(" and ")} (the worked example).`:""}</p></div>`;
  return `<div class="panel"><h2>${esc(first(who))}: your modules are ${mine.join(", ")}</h2><p>For each module below:</p><ol><li>Add <b>2 or 3 YouTube videos</b> (3 to 10 minutes each) that cover the module's topics.</li><li>Add <b>2 or 3 Stranger Than Fiction stories</b> with a source.</li><li>After Baptiste builds it, <b>click through it</b> and note anything to fix.</li></ol><p class="muted">Click a module to see its topics. Module 1 is filled in as an example.</p></div>`;}
function render(){
  document.getElementById("courses").innerHTML=["World History 1","World History 2"].map(c=>`<button class="${c===course?"on":""}" onclick="course='${c}';render()">${c}</button>`).join("");
  document.getElementById("people").innerHTML=["Everyone",...PEOPLE].map(p=>`<button class="${p===who?"on":""}" onclick="who='${p}';render()">${esc(first(p))}</button>`).join("");
  const ms=DATA.filter(d=>d.course===course&&(who==="Everyone"||(who==="Baptiste Buchler"?true:d.jobs.some(j=>j.who===who))));
  document.getElementById("top").innerHTML=topPanel(ms);
  document.getElementById("list").innerHTML=ms.map(d=>{const k=d.course+d.n;const kind=/project/i.test(d.type)?"project":/final/i.test(d.type)?"exam":"";
    return `<section class="module ${kind} ${open.has(k)?"open":""}"><div class="module-head" onclick="toggle('${k}')"><div class="num">${d.n}</div>
    <div><div class="title">${esc(d.focus)}</div><div class="topic">${esc(d.type)} · Savvas ${esc(d.coverage)}${d.lessons.length?": "+esc(d.lessons.map(l=>l.replace(/^\S+ /,"")).join(", ")):""}</div><div class="arrow">${open.has(k)?"▲ Close":"▼ Open module"}</div></div>
    <div class="chips">${chips(d)}</div></div><div class="details">${details(d)}</div></section>`}).join("");}
function toggle(k){open.has(k)?open.delete(k):open.add(k);render();}
function setAll(on){DATA.filter(d=>d.course===course).forEach(d=>on?open.add(d.course+d.n):open.delete(d.course+d.n));render();}
render();
